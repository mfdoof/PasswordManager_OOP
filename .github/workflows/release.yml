name: Release

on:
  push:
    tags: ['v*']

# Default for every job: read-only. Only the release job below may write (to create the release).
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      # Actions are pinned to full commit SHAs (version in the comment), same as ci.yml.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # full history, to check the tag is on main

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check tag matches pom version and is on main
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="$(mvn -B -ntp -q org.apache.maven.plugins:maven-help-plugin:3.5.1:evaluate \
            -Dexpression=project.version -DforceStdout)"
          if [ "v${VERSION}" != "${TAG}" ]; then
            echo "::error::Tag ${TAG} does not match pom version ${VERSION} (expected v${VERSION})"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${TAG} points to a commit that is not on main"
            exit 1
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Test and package
        run: mvn -B -ntp package

      - name: Prepare assets
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir dist
          cp target/doof-vault.jar "dist/doof-vault-${VERSION}.jar"
          cd dist
          sha256sum "doof-vault-${VERSION}.jar" > SHA256SUMS
          sha256sum -c SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          prerelease=()
          case "${VERSION}" in
            *-*) prerelease=(--prerelease) ;;  # e.g. 2.1.0-rc1
          esac
          gh release create "${TAG}" \
            "dist/doof-vault-${VERSION}.jar" dist/SHA256SUMS \
            --title "DOOF Vault ${TAG}" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"
