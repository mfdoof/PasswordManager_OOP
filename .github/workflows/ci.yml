name: CI

on:
  push:
  pull_request:

# Actions are pinned to full commit SHAs (version in the comment); Dependabot proposes updates.
# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B -ntp package

      - name: Upload jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: doof-vault-jar
          path: target/doof-vault.jar
          retention-days: 7
          if-no-files-found: error

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Pinned so CI and local runs agree (the runner's apt shellcheck is older and differs).
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install pinned ShellCheck
        run: |
          set -euo pipefail
          f="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl --proto '=https' --proto-redir '=https' -fsSLO \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${f}"
          echo "${SHELLCHECK_SHA256}  ${f}" | sha256sum -c -
          tar -xJf "${f}"
          echo "${PWD}/shellcheck-${SHELLCHECK_VERSION}" >> "${GITHUB_PATH}"

      - name: ShellCheck bin/doofv and install-doof-vault.sh
        run: |
          shellcheck --version
          shellcheck bin/doofv install-doof-vault.sh

      - name: Launcher embedded in install-doof-vault.sh matches bin/doofv
        run: diff <(awk "/<<'DOOF_WRAPPER'\$/{f=1;next} /^DOOF_WRAPPER\$/{f=0} f" install-doof-vault.sh) bin/doofv

  install:
    name: install-doof-vault.sh (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Java 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: '17'

      # Output is captured before grepping: `cmd | grep -q` under pipefail fails when grep exits
      # early and cmd is killed by SIGPIPE while still writing.
      - name: Install the latest release into a temporary HOME, run it, uninstall
        run: |
          set -euo pipefail
          home="$(mktemp -d)"
          HOME="$home" bash install-doof-vault.sh
          out="$(HOME="$home" bash install-doof-vault.sh)"
          grep -q "already installed and verified" <<<"$out"
          out="$(HOME="$home" "$home/.local/bin/doofv" backup --help)"
          grep -q "backup \[--vault <path>\]" <<<"$out"  # matches released and current usage text
          mkdir -p "$home/.doof" && echo keep > "$home/.doof/vault.db"
          HOME="$home" bash install-doof-vault.sh --uninstall
          test ! -e "$home/.local/bin/doofv"
          test ! -e "$home/.local/share/doof"
          test -f "$home/.doof/vault.db"

      - name: Validate the systemd user units (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          bash install-doof-vault.sh  # into the runner's own HOME: verify needs %h/.local/bin/doofv to exist
          systemd-analyze --user verify contrib/systemd/doof-backup.service contrib/systemd/doof-backup.timer

      - name: Validate the launchd agent (macOS)
        if: runner.os == 'macOS'
        run: plutil -lint contrib/launchd/quest.doof.vault-backup.plist
