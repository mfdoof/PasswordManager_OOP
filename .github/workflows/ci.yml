name: CI

on:
  push:
  pull_request:

# Read-only token: this workflow only builds and tests.
permissions:
  contents: read

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test and package
        run: mvn -B -ntp package

      - name: Upload jar
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: doof-vault-jar
          path: target/doof-vault.jar
          retention-days: 7
          if-no-files-found: error
